services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      LECTURA_DB_PASSWORD: ${LECTURA_DB_PASSWORD}
      TZ: America/Argentina/Mendoza
      PGTZ: America/Argentina/Mendoza
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # carga masiva, se corre aparte con: docker compose run --rm seed
  seed:
    build: ./db/seed
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SEMILLA: ${SEMILLA:-2026}
      FECHA_BASE: ${FECHA_BASE:-}
      RESULTADOS: /resultados
      TZ: America/Argentina/Mendoza
    volumes:
      - ./docs/resultados:/resultados

  # medicion de indices, se corre aparte con: docker compose run --rm indices
  indices:
    build: ./db/seed
    profiles: ["indices"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    working_dir: /repo
    command: ["python", "db/indices/medir.py"]
    volumes:
      - ./db:/repo/db:ro
      - ./docs/resultados:/repo/docs/resultados

volumes:
  datos_db:
