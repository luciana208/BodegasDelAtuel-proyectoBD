services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      LECTURA_DB_PASSWORD: ${LECTURA_DB_PASSWORD}
      TZ: America/Argentina/Mendoza
      PGTZ: America/Argentina/Mendoza
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: bodega_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TZ: America/Argentina/Mendoza
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  front:
    build: ./front
    depends_on:
      - api
    environment:
      API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONT_PORT:-8080}:80"

  # pruebas de la api contra la base real, se corren con: docker compose run --rm api-pruebas
  api-pruebas:
    build: ./api
    profiles: ["pruebas"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: bodega_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      PRUEBAS_OWNER_USER: ${POSTGRES_USER}
      PRUEBAS_OWNER_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Mendoza
    command: ["pytest", "-v", "tests"]

  # carga masiva, se corre aparte con: docker compose run --rm seed
  seed:
    build: ./db/seed
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SEMILLA: ${SEMILLA:-2026}
      FECHA_BASE: ${FECHA_BASE:-}
      RESULTADOS: /resultados
      TZ: America/Argentina/Mendoza
    volumes:
      - ./docs/resultados:/resultados

  # medicion de indices, se corre aparte con: docker compose run --rm indices
  indices:
    build: ./db/seed
    profiles: ["indices"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    working_dir: /repo
    command: ["python", "db/indices/medir.py"]
    volumes:
      - ./db:/repo/db:ro
      - ./docs/resultados:/repo/docs/resultados

  # herramientas para la base en la nube: docker compose run --rm nube bash db/nube/<script>
  nube:
    build: ./db/seed
    profiles: ["nube"]
    env_file:
      - path: .env.nube
        required: false
    environment:
      TZ: America/Argentina/Mendoza
    working_dir: /repo
    volumes:
      - .:/repo

volumes:
  datos_db:
